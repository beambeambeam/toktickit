openapi: 3.1.0
info:
  title: TokTickIT API
  version: 1.0.0
  description: API contract for the TokTickIT service.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/auth/login:
    post:
      operationId: postApiAuthLogin
      summary: Sign in
      description: Creates a restricted or normal opaque session for an active User.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The authenticated User and CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/auth/me:
    get:
      operationId: getApiAuthMe
      summary: Get the current User
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current User and CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/auth/change-password:
    post:
      operationId: postApiAuthChangePassword
      summary: Change the current password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The rotated unrestricted session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/auth/logout:
    post:
      operationId: postApiAuthLogout
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "204":
          description: The session was revoked.
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/categories:
    get:
      operationId: getApiCategories
      summary: List active Categories
      description: Returns active Categories in display order.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The active Categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
              examples:
                populated:
                  summary: Active Categories are available
                  value:
                    items:
                      - id: 1
                        name: Account and Access
                      - id: 2
                        name: Hardware
                empty:
                  summary: No active Categories are available
                  value:
                    items: []
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/related-systems:
    get:
      operationId: getApiRelatedSystems
      summary: List active Related Systems
      description: Returns active Related Systems in display order.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The active Related Systems.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedSystemListResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/staff/tickets:
    get:
      operationId: getApiStaffTickets
      summary: List the shared Ticket Queue
      description: Returns operational Ticket summaries for IT Staff and read-only Administrators.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/RelatedSystemId"
        - $ref: "#/components/parameters/RequestedPriority"
        - $ref: "#/components/parameters/ItPriority"
        - $ref: "#/components/parameters/CurrentStatus"
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/QueueSortBy"
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/QueuePageSize"
      responses:
        "200":
          description: The shared operational Ticket page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketListResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/staff/owners:
    get:
      operationId: getApiStaffOwners
      summary: List eligible Ticket Owners
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active IT Staff and Administrators eligible for assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerListResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/status:
    post:
      operationId: updateApiTicketStatus
      summary: Progress a Ticket
      description: Applies one approved status transition for IT Staff.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusMutationRequest"
      responses:
        "200":
          description: The updated Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/resolution-indication:
    put:
      operationId: indicateApiTicketResolution
      summary: Indicate apparent Ticket resolution
      description: Records an owning Requester's apparent-resolution indication without formally changing status.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: The recorded indication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolutionIndicationResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/claim:
    post:
      operationId: claimApiTicket
      summary: Claim an unassigned Ticket
      description: Assigns the current IT Staff member when the Ticket is unassigned.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketVersionRequest"
      responses:
        "200":
          description: The updated Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/owner:
    put:
      operationId: updateApiTicketOwner
      summary: Assign a Ticket Owner
      description: Assigns, reassigns, or unassigns a Ticket Owner.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerMutationRequest"
      responses:
        "200":
          description: The updated Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/it-priority:
    patch:
      operationId: updateApiTicketItPriority
      summary: Set a Ticket IT Priority
      description: Sets the operational IT Priority without changing Requested Priority.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItPriorityMutationRequest"
      responses:
        "200":
          description: The updated Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/users:
    get:
      operationId: getApiUsers
      summary: List users
      description: Returns users for Administrator account management.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserSearch"
        - $ref: "#/components/parameters/UserRole"
      responses:
        "200":
          description: The matching users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
    post:
      operationId: createApiUser
      summary: Create a user account
      description: Creates one active or inactive one-role account with an initial password.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user without credential secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "403":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/health:
    get:
      operationId: getApiHealth
      summary: Check API liveness
      description: Returns a static response when the API process is alive.
      responses:
        "200":
          description: The API process is alive.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: TokTickIT API
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets:
    post:
      operationId: createApiTicket
      summary: Create a requester Ticket
      description: Creates one Ticket owned by the authenticated Requester.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: The created Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTicketResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "413":
          $ref: "#/components/responses/ApiErrorResponse"
        "415":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
    get:
      operationId: getApiTickets
      summary: List owned requester Tickets
      description: Returns only Tickets owned by the authenticated Requester.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/RelatedSystemId"
        - $ref: "#/components/parameters/RequestedPriority"
        - $ref: "#/components/parameters/CurrentStatus"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDirection"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The owned Ticket page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}:
    get:
      operationId: getApiTicket
      summary: Get a Ticket
      description: Requesters can read their own Tickets; IT Staff and Administrators can read every Ticket.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: The Ticket Detail for the permitted reader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/attachments:
    get:
      operationId: getApiTicketAttachments
      summary: List Ticket Attachment metadata
      description: Requesters can read their own Ticket Attachments; IT Staff and Administrators can read every Ticket's metadata.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Attachment metadata for the permitted Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
    post:
      operationId: createApiTicketAttachments
      summary: Add Attachments to an owned Ticket
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "201":
          description: The created Attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
        "413":
          $ref: "#/components/responses/ApiErrorResponse"
        "415":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/attachments/{attachmentId}/content:
    get:
      operationId: getApiTicketAttachmentContent
      summary: Download an active Attachment
      description: Requesters can download active Attachments from their own Tickets; IT Staff and Administrators can download active Attachments from every Ticket.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: The Attachment content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tickets/{ticketId}/attachments/{attachmentId}:
    delete:
      operationId: removeApiTicketAttachment
      summary: Soft-remove an owned Attachment
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/AttachmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAttachmentRequest"
      responses:
        "200":
          description: The retained removed Attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveAttachmentResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Synchronizer token returned by login or current-user retrieval.
      schema:
        type: string
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    UserSearch:
      name: search
      in: query
      required: false
      description: Literal case-insensitive substring of user name or email.
      schema:
        type: string
        maxLength: 200
    UserRole:
      name: role
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UserRole"
    CategoryId:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    RelatedSystemId:
      name: relatedSystemId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    RequestedPriority:
      name: requestedPriority
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RequestedPriority"
    CurrentStatus:
      name: currentStatus
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CurrentStatus"
    ItPriority:
      name: itPriority
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RequestedPriority"
    Owner:
      name: owner
      in: query
      required: false
      description: Eligible owner ID, me, or unassigned.
      schema:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            enum: [me, unassigned]
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum:
          [
            ticketNumber,
            ticketDate,
            summary,
            requestedPriority,
            currentStatus,
            updatedAt,
          ]
        default: updatedAt
    SortDirection:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    QueueSortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [ticketDate, updatedAt, itPriority, ticketNumber]
        default: updatedAt
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [10, 25, 50]
        default: 10
    QueuePageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [10, 20, 50]
        default: 20
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: toktickit_session
  responses:
    ApiErrorResponse:
      description: The API could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
    ApiErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    RelatedSystem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    RelatedSystemListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelatedSystem"
    User:
      type: object
      additionalProperties: false
      required:
        [
          id,
          displayName,
          email,
          role,
          isActive,
          mustChangePassword,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [Requester, IT Staff, Administrator]
    UserListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, role, isActive, initialPassword]
      properties:
        displayName:
          type: string
